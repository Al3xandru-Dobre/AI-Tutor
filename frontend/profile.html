<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Japanese AI Tutor</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: var(--background);
            min-height: 100vh;
            padding: 20px;
        }

        .profile-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-header {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            padding: 40px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-xl);
        }

        .profile-header-content {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
            flex-shrink: 0;
        }

        .profile-info h1 {
            font-size: 2em;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-primary);
        }

        .profile-info p {
            color: var(--text-secondary);
            margin: 0 0 4px 0;
        }

        .profile-section {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
        }

        .profile-section h2 {
            font-size: 1.5em;
            font-weight: 700;
            margin: 0 0 24px 0;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-section h2::before {
            content: '';
            width: 4px;
            height: 28px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-subtle);
        }

        .form-input:disabled {
            background: var(--surface);
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            padding: 14px 24px;
            border-radius: var(--radius-lg);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .btn-secondary {
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: var(--accent-subtle);
        }

        .btn-danger {
            background: transparent;
            border: 2px solid var(--error);
            color: var(--error);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .message {
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
            display: block;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 24px;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        body.light-theme .profile-header,
        body.light-theme .profile-section {
            background: white;
            border-color: #e0e0e0;
        }

        body.light-theme .form-input:disabled {
            background: #f5f5f5;
        }

        @media (max-width: 768px) {
            .profile-header-content {
                flex-direction: column;
                text-align: center;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.body.classList.add(t+'-theme');})();</script>
    <div class="profile-container">
        <a href="chat.html" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Chat
        </a>

        <div class="profile-header">
            <div class="profile-header-content">
                <div class="profile-avatar" id="profileAvatar"><svg class="icon" style="width:36px;height:36px"><use href="icons.svg#user"/></svg></div>
                <div class="profile-info">
                    <h1 id="userName">Loading...</h1>
                    <p id="userEmail">Loading...</p>
                    <p id="userVerified">Verification Status: Loading...</p>
                    <p id="userJoined">Member since: Loading...</p>
                </div>
            </div>
        </div>

        <div class="profile-section">
            <h2>Learning Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="statConversations">0</div>
                    <div class="stat-label">Conversations</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statMessages">0</div>
                    <div class="stat-label">Messages Exchanged</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statDays">0</div>
                    <div class="stat-label">Days Learning</div>
                </div>
            </div>
        </div>

        <div class="profile-section">
            <h2>Profile Settings</h2>
            <form id="profileForm">
                <div id="profileMessage" class="message"></div>
                
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        class="form-input"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email (cannot be changed)</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input"
                        disabled
                    >
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                    <a href="forgot-password.html" class="btn btn-secondary">Change Password</a>
                </div>
            </form>
        </div>

        <div class="profile-section">
            <h2>Account Actions</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">
                Once you delete your account, there is no going back. Please be certain.
            </p>
            <div class="btn-group">
                <button type="button" class="btn btn-danger" id="deleteBtn">Delete Account</button>
            </div>
        </div>
    </div>

    <script>
        const currentTheme = localStorage.getItem('theme') || 'dark';
        document.body.classList.add(currentTheme + '-theme');

        async function loadProfile() {
            try {
                const response = await fetch('/api/auth/profile', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load profile');
                }

                const data = await response.json();
                const user = data.user;

                document.getElementById('userName').textContent = user.name || 'Unknown';
                document.getElementById('userEmail').textContent = user.email || 'Unknown';
                document.getElementById('userVerified').textContent = 
                    user.emailVerified ? 'Email Verified ✓' : 'Email Not Verified';
                document.getElementById('userVerified').style.color = 
                    user.emailVerified ? 'var(--success)' : 'var(--warning)';
                document.getElementById('userJoined').textContent = 
                    user.createdAt ? `Member since: ${new Date(user.createdAt).toLocaleDateString()}` : '';
                document.getElementById('name').value = user.name || '';
                document.getElementById('email').value = user.email || '';

                const avatar = document.getElementById('profileAvatar');
                avatar.textContent = (user.name || 'U').charAt(0).toUpperCase();

            } catch (error) {
                console.error('Error loading profile:', error);
                window.location.href = 'login.html';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/users/me/stats', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load stats');
                }

                const data = await response.json();
                const stats = data.stats || {};

                document.getElementById('statConversations').textContent = stats.conversationCount || 0;
                document.getElementById('statMessages').textContent = stats.messageCount || 0;
                
                if (stats.createdAt) {
                    const daysSinceCreated = Math.floor(
                        (new Date() - new Date(stats.createdAt)) / (1000 * 60 * 60 * 24)
                    );
                    document.getElementById('statDays').textContent = daysSinceCreated;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        const profileForm = document.getElementById('profileForm');
        const profileMessage = document.getElementById('profileMessage');
        const saveBtn = document.getElementById('saveBtn');

        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const response = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ name, email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to update profile');
                }

                profileMessage.className = 'message success';
                profileMessage.textContent = data.message || 'Profile updated successfully!';
                document.getElementById('userName').textContent = name;
                document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
            } catch (error) {
                profileMessage.className = 'message error';
                profileMessage.textContent = error.message || 'Failed to update profile. Please try again.';
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
                
                setTimeout(() => {
                    profileMessage.style.display = 'none';
                }, 5000);
            }
        });

        const deleteBtn = document.getElementById('deleteBtn');

        deleteBtn.addEventListener('click', async () => {
            if (!confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
                return;
            }

            if (!confirm('This will permanently delete all your data including conversations, notebooks, and vocabulary. Continue?')) {
                return;
            }

            deleteBtn.disabled = true;
            deleteBtn.textContent = 'Deleting...';

            try {
                const response = await fetch('/api/users/me', {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete account');
                }

                localStorage.clear();
                window.location.href = 'index.html';
            } catch (error) {
                alert('Failed to delete account. Please try again.');
                deleteBtn.disabled = false;
                deleteBtn.textContent = 'Delete Account';
            }
        });

        loadProfile();
        loadStats();
    </script>
</body>
</html>
