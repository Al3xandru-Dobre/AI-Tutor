<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Japanese AI Tutor</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="landing.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.body.classList.add(t+'-theme');})();</script>
    <div class="auth-container">
        <!-- Static kana watermark -->
        <div class="auth-kana" aria-hidden="true">鍵</div>

        <a href="index.html" class="back-to-home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Home
        </a>

        <!-- Theme toggle -->
        <button class="auth-theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-pressed="false" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon theme-icon-sun" style="display:none"><use href="icons.svg#sun"/></svg>
            <svg class="icon theme-icon-moon"><use href="icons.svg#moon"/></svg>
        </button>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo"><svg class="logo-mark" viewBox="0 0 26 26" aria-hidden="true"><rect class="tile" x="0.5" y="0.5" width="25" height="25" rx="5.5"/><text class="glyph" x="13" y="18.5" font-size="15" text-anchor="middle">日</text></svg></div>
                <h1 class="auth-title">Forgot Password?</h1>
                <p class="auth-subtitle">No worries, we'll send you reset instructions.</p>
            </div>

            <form class="auth-form" id="forgotForm">
                <div id="messageContainer"></div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn" id="sendBtn">
                    Send Reset Link
                </button>
            </form>

            <div class="auth-links">
                <p class="auth-text">Remember your password?</p>
                <a href="login.html" class="auth-link">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/ui-utils.js"></script>
    <script>initializeTheme();</script>
    <script>
        const forgotForm = document.getElementById('forgotForm');
        const sendBtn = document.getElementById('sendBtn');
        const messageContainer = document.getElementById('messageContainer');

        function showMessage(message, type = 'error') {
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
            messageDiv.textContent = message;
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);
            
            setTimeout(() => {
                if (messageContainer.contains(messageDiv)) {
                    messageDiv.remove();
                }
            }, 5000);
        }

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(forgotForm);
            const email = formData.get('email');

            if (!email) {
                showMessage('Please enter your email address');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/api/auth/forgot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Request failed');
                }

                showMessage(data.message || 'If an account exists with this email, a password reset link has been sent.', 'success');
                sendBtn.textContent = 'Link Sent';
            } catch (error) {
                showMessage(error.message || 'An error occurred. Please try again.');
            } finally {
                setTimeout(() => {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send Reset Link';
                }, 2000);
            }
        });
    </script>
</body>
</html>
